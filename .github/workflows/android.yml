name: Build and publish Ad Lords
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    # the public updates repo builds on every push; the private source repo only when you run it by hand
    if: github.repository == 'iwantcustody/Ad-Lords-Updates' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Hash game files and app
        run: |
          VC=$((GITHUB_RUN_NUMBER + 100))
          echo "VC=$VC" >> "$GITHUB_ENV"
          python3 tools/manifest.py "$VC" "$GITHUB_SHA" "$GITHUB_REPOSITORY" >> "$GITHUB_ENV"
      - name: Build signed APK
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          FEED="https://github.com/$GITHUB_REPOSITORY/releases/latest/download/update.json"
          ./gradlew --no-daemon assembleRelease -PversionCode=$VC -PnativeHash=$NATIVE_HASH -PupdateFeed=$FEED
          cp app/build/outputs/apk/release/app-release.apk AdLords.apk
      - uses: actions/upload-artifact@v4
        with:
          name: AdLords-apk
          path: AdLords.apk
          if-no-files-found: error
      - name: Publish release (the app checks this for updates)
        if: github.repository == 'iwantcustody/Ad-Lords-Updates'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v$VC" AdLords.apk build/update.json --title "Ad Lords $VC" --notes "Build $VC from ${GITHUB_SHA::7}" --latest
